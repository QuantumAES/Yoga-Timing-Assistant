name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    name: Сборка, тесты и статический анализ
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # JDK 21: AGP 9.x и Kotlin 2.4 не собираются на более новых JVM.
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Формат (ktlint через spotless)
        run: ./gradlew spotlessCheck --stacktrace

      - name: Статический анализ (detekt)
        run: ./gradlew detekt --stacktrace

      - name: Сборка и юнит-тесты
        run: ./gradlew build --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      - name: Отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
