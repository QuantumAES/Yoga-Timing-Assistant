# ─── Gradle ──────────────────────────────────────────────────────────────────
#
# Потолки памяти заданы явно под машину с 8 ГБ. С дефолтными значениями демон
# Gradle и демон Kotlin вместе занимают около 4 ГБ, после чего эмулятору не
# остаётся места: он умирает молча, а сборка сообщает «No connected devices».
#
# Инструментальные тесты запускать через ./scripts/run-instrumented-tests.sh —
# скрипт сначала собирает APK, затем гасит демоны и только после этого
# поднимает эмулятор.
#
# Metaspace намеренно не ограничен: KSP поднимает IntelliJ Analysis API, который
# загружает десятки тысяч классов, и при жёстком потолке падает с
# «Could not initialize class ksp.com.intellij...». Расход памяти держит -Xmx.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

# Демон не должен занимать память, когда сборкой никто не занимается:
# три минуты простоя — и он выходит. Кэши остаются на диске, так что
# следующая сборка теряет только время старта JVM.
# Немедленная выгрузка — ./scripts/free-memory.sh
org.gradle.daemon.idletimeout=180000

# ─── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official

# Демон Kotlin с явным потолком. Вариант kotlin.compiler.execution.strategy=in-process
# сэкономил бы эту JVM, но с ним падает KSP (NoClassDefFoundError в инициализации
# IntelliJ-платформы) — то есть Room и Hilt перестают генерировать код.
# Память вместо этого освобождается по простою и скриптом ./scripts/free-memory.sh
kotlin.daemon.jvmargs=-Xmx1200m

# ─── Android ─────────────────────────────────────────────────────────────────
# AGP 9 включает newDsl и builtInKotlin по умолчанию — плагин
# org.jetbrains.kotlin.android не применяется и не должен применяться.
android.useAndroidX=true
