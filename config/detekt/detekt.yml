# Поверх дефолтного набора правил detekt (buildUponDefaultConfig = true).
# Здесь только осознанные отклонения — всё остальное берётся из умолчаний.

style:
  MaxLineLength:
    maxLineLength: 120
  # В демо-данных числа — это и есть содержимое: длительности этапов
  # осмысленны сами по себе, а константы вида FIVE_MINUTES только мешают читать.
  #
  # Список исключений задаётся целиком: detekt не дополняет умолчания, а
  # заменяет их, поэтому тестовые каталоги приходится перечислять заново —
  # иначе правило включилось бы в тестах, где числа и есть ожидаемые значения.
  MagicNumber:
    excludes:
      - '**/seed/**'
      - '**/test/**'
      - '**/androidTest/**'
      - '**/commonTest/**'
      - '**/jvmTest/**'
      - '**/androidUnitTest/**'
      - '**/androidInstrumentedTest/**'

naming:
  # @Composable-функции по соглашению именуются с заглавной буквы.
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    ignoreAnnotated: ['Composable']
  # Файлы *Navigation.kt намеренно держат маршрут и его NavGraphBuilder-расширение
  # рядом: это единица публичного API feature-модуля.
  MatchingDeclarationName:
    excludes: ['**/*Navigation.kt']

complexity:
  # У Composable-функций много параметров — это норма для слотов и колбэков.
  LongParameterList:
    ignoreAnnotated: ['Composable']

exceptions:
  TooGenericExceptionCaught:
    active: true
