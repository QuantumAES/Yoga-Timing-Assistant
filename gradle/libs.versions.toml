#
# Единая точка правды по версиям. Ни одна зависимость не объявляется строкой
# в build.gradle.kts — только через этот каталог (требование Фазы 1).
#
[versions]
# ─── Платформа ──────────────────────────────────────────────────────────────
# compileSdk 37 — требование AndroidX 2026 (core-ktx 1.19, lifecycle 2.11 и др.).
# targetSdk остаётся 36: в рантайм-поведение Android 17 не опрокидываемся,
# пока не пройдена матрица устройств (Фаза 8).
compileSdk = "37"
minSdk = "26"
targetSdk = "36"
# JDK, на котором ИДЁТ сборка (toolchain). AGP 9 / Kotlin 2.4 не работают на JDK 25.
jdkToolchain = "21"
# Версия байткода, которую потребляет D8/R8. Ниже toolchain намеренно.
javaTarget = "17"

# ─── Инструменты сборки ─────────────────────────────────────────────────────
agp = "9.3.1"                   # требует Gradle >= 9.5, build-tools >= 36
kotlin = "2.4.10"
ksp = "2.3.10"                  # соответствует Kotlin 2.4.10
detekt = "2.0.0-alpha.5"        # 1.23.x собран на Kotlin 2.0 и не парсит 2.4
spotless = "8.9.0"
ktlint = "1.8.0"
kover = "0.9.9"

# ─── AndroidX / Compose ─────────────────────────────────────────────────────
composeBom = "2026.06.01"
androidxCore = "1.19.0"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
androidxNavigation = "2.9.8"
androidxSplashscreen = "1.2.0"
androidxHiltNavigation = "1.4.0"

# ─── DI ─────────────────────────────────────────────────────────────────────
hilt = "2.60.1"

# ─── Kotlin-библиотеки ──────────────────────────────────────────────────────
coroutines = "1.11.0"
serialization = "1.11.0"

# ─── Данные (Фаза 2) ────────────────────────────────────────────────────────
room = "2.8.4"
datastore = "1.2.1"

# ─── Тесты ──────────────────────────────────────────────────────────────────
junit5 = "6.1.2"
junit4 = "4.13.2"
turbine = "1.2.1"
mockk = "1.14.11"
truth = "1.4.5"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

[libraries]
# ─── AndroidX базовый ───────────────────────────────────────────────────────
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }

# ─── Compose (версии приходят из BOM) ───────────────────────────────────────
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# Наборы иконок заморожены на 1.7.8 и версией из BOM управляются, но
# публикуются и работают. core — базовые ~150 иконок, extended — все ~2000
# (в проект не берём: R8 их вырезает, но сборка и индексация замедляются).
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

# ─── Lifecycle / Navigation ─────────────────────────────────────────────────
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }

# ─── DI ─────────────────────────────────────────────────────────────────────
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHiltNavigation" }
# hiltViewModel() переехал сюда из hilt-navigation-compose; тот его подтягивает
# транзитивно, но объявляем явно — API используется напрямую.
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHiltNavigation" }

# ─── Kotlin ─────────────────────────────────────────────────────────────────
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# ─── Данные (Фаза 2) ────────────────────────────────────────────────────────
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ─── Тесты ──────────────────────────────────────────────────────────────────
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# ─── Артефакты плагинов для build-logic ─────────────────────────────────────
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Конвенционные плагины проекта (build-logic)
yta-android-application = { id = "yta.android.application" }
yta-android-library = { id = "yta.android.library" }
yta-android-compose = { id = "yta.android.compose" }
yta-android-feature = { id = "yta.android.feature" }
yta-android-hilt = { id = "yta.android.hilt" }
yta-jvm-library = { id = "yta.jvm.library" }
