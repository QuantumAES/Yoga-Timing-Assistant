#
# Критерии JVM для демона Gradle.
#
# Благодаря этому файлу `./gradlew` собирает проект на JDK 21 независимо от того,
# какая java стоит в системе по умолчанию (у разработчика это JDK 25, на котором
# AGP 9 и Kotlin 2.4 не работают). Экспортировать JAVA_HOME не нужно.
#
# JDK ищется штатным авто-обнаружением toolchains: ~/.jdks, SDKMAN, /usr/lib/jvm.
# Установка — ./scripts/setup-dev-env.sh
#
toolchainVersion=21
